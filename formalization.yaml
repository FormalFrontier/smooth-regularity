version: "v0.4"

project:
  name: smooth-regularity
  description: >-
    Cotangent-space comparisons, presentation-relation and local Jacobian
    criteria, smooth-to-regular implications, and Dedekind consequences for
    commutative algebras and affine schemes over fields.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

repository:
  role: substantive-development

sources:
  - title: The Stacks Project
    authors:
      - The Stacks Project Authors
    type: online mathematical reference
    location: Tags 00TR and 00TT
    url: https://stacks.math.columbia.edu/tag/00TT
    relationship: background
    note: >-
      Mathematical context for differential-rank and local smoothness criteria.
      The library retains explicit hypotheses and does not claim the full
      regular-to-smooth converse or complete coverage of these tags.
      Source text is not bundled and no source-author endorsement is claimed.
  - title: Smooth regularity and cotangent-relation constructions
    authors:
      - Formal Frontier Agents
    type: original project proofs
    relationship: formalizes
    note: >-
      Original project Lean developments built on mathlib. Earlier Worker A,
      Lattice and Prism contributions are distinguished from later readiness
      assembly in README.md; mathematical citations do not replace formal
      expression provenance.

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5
    relationship: builds-on
    note: >-
      Pinned external dependency for Kähler differentials, cotangent complexes,
      presentations, localization, regular local rings, smoothness, dimension,
      Dedekind domains and schemes. Upstream attribution and licenses remain
      distinct from project contributor credit.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean and Lake with pinned mathlib and
        independent non-author agent development review.
  notes: >-
    AI-assisted development under human project direction. No human mathematical
    review, model identity, total expenditure or elapsed-time total is asserted.

status:
  scope: >-
    Reusable cotangent and presentation-relation APIs, conditional local
    Jacobian criteria, smooth-to-regular implications over fields, and
    dimension-at-most-one Dedekind consequences. The general converse from
    regularity to smoothness is not included. Relation selection alone does
    not establish generation, quotient regularity or target smoothness.
    Affine Dedekind results retain integrality, affineness, smoothness and the
    topological dimension bound. Complete source formalization is not claimed.

review:
  status: agent-reviewed
  notes: >-
    Mathematical contributions, native-module migration, six persistent
    ordinary-import clients and the conormal evaluation API have independent
    non-author agent development reviews. The evaluation API has an explicitly
    documented breaking migration from external definitional reduction to
    propositional theorems; full backward compatibility is not claimed.
    Generated native API documentation is included, with its input and content
    manifests and explicit display/proof-census limits. Remaining convention checks
    and exact full first-release artifact, documentation and rights review are
    still pending. This metadata reconciliation itself awaits independent review.
    Development review and schema validity do not
    establish complete release acceptance, publication, human review or source-author
    endorsement.

acknowledgements: >-
  Formalization Worker A executions supplied the split-residue and smooth-at-prime
  bridges; Lattice supplied further cotangent, relation, dimension and regularity
  infrastructure and integration; Prism supplied the Dedekind ring and affine
  scheme adapters. Later Worker B executions supplied native-module adoption,
  persistent public-import clients and the conormal evaluation API, with fresh
  non-author Worker A development review. Exact contributor examples are retained
  in README.md.
  External libraries and tools retain their own attribution, license terms
  and notices.
